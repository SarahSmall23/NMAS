<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  NMAS Notification Bell
  =======================
  Include with:
      <div th:replace="~{fragments/notification-bell :: notificationBell}"></div>

  Self-contained (scoped styles), polls /api/notifications/unread-count every
  20s for the badge, and fetches the full list from /api/notifications when
  opened. Backend: NotificationController — restricted to doctor + patient
  accounts only.
-->
<div th:fragment="notificationBell" id="nb-root">
    <style>
        #nb-root, #nb-root * { box-sizing: border-box; }
        #nb-root { position: relative; font-family: Arial, sans-serif; }

        #nbBellBtn {
            position: relative; width: 46px; height: 46px; border-radius: 50%;
            background: white; border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06); color: #1C2B2B;
        }
        #nbBellBtn:hover { background: #f0fdfa; }
        #nbBadge {
            position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px;
            border-radius: 8px; background: #dc2626; color: #fff; font-size: 10px;
            font-weight: 700; display: none; align-items: center; justify-content: center;
            padding: 0 3px; line-height: 1;
        }
        #nbBadge.show { display: flex; }

        #nbPanel {
            position: absolute; top: 56px; right: 0; width: 340px; max-width: 90vw;
            max-height: 420px; background: white; border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18); border: 1px solid #e2e8f0;
            display: none; flex-direction: column; overflow: hidden; z-index: 500;
        }
        #nbPanel.open { display: flex; }
        .nb-header {
            padding: 14px 16px; border-bottom: 1px solid #e2e8f0; display: flex;
            align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .nb-header strong { color: #1C2B2B; font-size: 14px; }
        .nb-header button {
            background: none; border: none; color: #059669; font-size: 11.5px;
            font-weight: 600; cursor: pointer;
        }
        .nb-header button:hover { text-decoration: underline; }
        .nb-list { overflow-y: auto; flex: 1; }
        .nb-empty { padding: 30px 16px; text-align: center; color: #94a3b8; font-size: 13px; }
        .nb-item {
            display: block; padding: 12px 16px; border-bottom: 1px solid #f1f5f9;
            text-decoration: none; color: #1C2B2B; cursor: pointer; transition: background 0.15s;
        }
        .nb-item:hover { background: #f8fafc; }
        .nb-item.unread { background: #f0fdfa; }
        .nb-item .nb-msg { font-size: 13px; line-height: 1.5; }
        .nb-item .nb-time { font-size: 10.5px; color: #94a3b8; margin-top: 4px; }
        .nb-item .nb-dot { width: 7px; height: 7px; border-radius: 50%; background: #059669; display: inline-block; margin-right: 6px; }
    </style>

    <button id="nbBellBtn" title="Notifications">
        <i class="ti ti-bell"></i>
        <span id="nbBadge">0</span>
    </button>

    <div id="nbPanel">
        <div class="nb-header">
            <strong>Notifications</strong>
            <button id="nbMarkAllBtn">Mark all read</button>
        </div>
        <div class="nb-list" id="nbList">
            <div class="nb-empty">Loading...</div>
        </div>
    </div>

    <script>
    (function () {
        var bellBtn = document.getElementById('nbBellBtn');
        var panel = document.getElementById('nbPanel');
        var badge = document.getElementById('nbBadge');
        var list = document.getElementById('nbList');
        var markAllBtn = document.getElementById('nbMarkAllBtn');

        function refreshCount() {
            fetch('/api/notifications/unread-count').then(function (r) { return r.json(); }).then(function (data) {
                if (data.count > 0) {
                    badge.textContent = data.count > 9 ? '9+' : data.count;
                    badge.classList.add('show');
                } else {
                    badge.classList.remove('show');
                }
            }).catch(function () {});
        }

        function loadList() {
            list.innerHTML = '<div class="nb-empty">Loading...</div>';
            fetch('/api/notifications').then(function (r) { return r.json(); }).then(function (items) {
                if (!items.length) {
                    list.innerHTML = '<div class="nb-empty">No notifications yet.</div>';
                    return;
                }
                list.innerHTML = '';
                items.forEach(function (n) {
                    var a = document.createElement('a');
                    a.className = 'nb-item' + (!n.read ? ' unread' : '');
                    a.href = n.link || '#';
                    a.innerHTML =
                        '<div class="nb-msg">' + (!n.read ? '<span class="nb-dot"></span>' : '') + esc(n.message) + '</div>'
                      + '<div class="nb-time">' + timeAgo(n.createdAt) + '</div>';
                    a.addEventListener('click', function () {
                        if (!n.read) {
                            fetch('/api/notifications/' + n.id + '/read', { method: 'POST' }).catch(function(){});
                        }
                    });
                    list.appendChild(a);
                });
            }).catch(function () {
                list.innerHTML = '<div class="nb-empty">Could not load notifications.</div>';
            });
        }

        bellBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            var willOpen = !panel.classList.contains('open');
            panel.classList.toggle('open');
            if (willOpen) loadList();
        });

        document.addEventListener('click', function (e) {
            if (!panel.contains(e.target) && e.target !== bellBtn) {
                panel.classList.remove('open');
            }
        });

        markAllBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            fetch('/api/notifications/read-all', { method: 'POST' }).then(function () {
                refreshCount();
                loadList();
            }).catch(function () {});
        });

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function timeAgo(iso) {
            try {
                var then = new Date(iso).getTime();
                var diffMin = Math.round((Date.now() - then) / 60000);
                if (diffMin < 1) return 'just now';
                if (diffMin < 60) return diffMin + 'm ago';
                var diffHr = Math.round(diffMin / 60);
                if (diffHr < 24) return diffHr + 'h ago';
                return Math.round(diffHr / 24) + 'd ago';
            } catch (e) { return ''; }
        }

        refreshCount();
        setInterval(refreshCount, 20000); // poll every 20s
    })();
    </script>
</div>

</body>
</html>
