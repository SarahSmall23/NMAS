<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Visit Records - NMAS</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body{ background:#F0FAF5; padding:40px; color:#1A2E1A; }
        .container{ max-width:1200px; margin:auto; }
        .header{ margin-bottom:30px; }
        .top-actions{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
        .btn{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:12px 18px; border-radius:10px; font-size:14px; font-weight:600; transition:0.2s; border:none; cursor:pointer; }
        .btn-primary{ background:#059669; color:white; }
        .btn-primary:hover{ background:#1C2B2B; }
        .btn-secondary{ background:#e2e8f0; color:#1A2E1A; }
        .btn-secondary:hover{ background:#cbd5e1; }
        .btn-danger{ background:#dc2626; color:white; font-size:13px; padding:8px 14px; }
        .btn-danger:hover{ background:#b91c1c; }
        h1{ color:#1C2B2B; font-size:32px; margin-bottom:8px; }
        .subtitle{ color:#64748b; }
        .stat-bar{ display:flex; gap:20px; margin-bottom:30px; flex-wrap:wrap; }
        .stat{ background:white; padding:18px 24px; border-radius:14px; box-shadow:0 5px 20px rgba(0,0,0,0.06); }
        .stat p{ font-size:28px; font-weight:bold; color:#1C2B2B; }
        .stat span{ font-size:13px; color:#64748b; }
        .card{ background:white; border-radius:18px; box-shadow:0 8px 25px rgba(0,0,0,0.06); overflow:hidden; }
        table{ width:100%; border-collapse:collapse; }
        thead{ background:#1C2B2B; color:white; }
        thead th{ padding:16px 18px; text-align:left; font-size:14px; }
        tbody tr{ border-bottom:1px solid #f1f5f9; transition:0.15s; }
        tbody tr:hover{ background:#f8fafc; }
        tbody td{ padding:14px 18px; font-size:14px; color:#334155; vertical-align:middle; }
        .badge{ display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
        .badge-open{ background:#dcfce7; color:#166534; }
        .badge-closed{ background:#f1f5f9; color:#64748b; }
        .empty{ padding:60px; text-align:center; color:#64748b; }
        .empty i{ font-size:50px; margin-bottom:15px; color:#cbd5e1; display:block; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="top-actions">
            <a th:href="@{/visits/new}" class="btn btn-primary">
                <i class="ti ti-plus"></i> Record New Visit
            </a>
            <a th:href="@{/redirect-dashboard}" class="btn btn-secondary">
                <i class="ti ti-layout-dashboard"></i> Back to Dashboard
            </a>
        </div>
        <h1><i class="ti ti-clipboard-heart"></i> Visit Records</h1>
        <p class="subtitle">All patient visits recorded in the NMAS system.</p>
    </div>

    <div class="stat-bar">
        <div class="stat">
            <p th:text="${totalVisits}">0</p>
            <span>Total Visits</span>
        </div>
    </div>

    <div class="card">
        <div th:if="${visits.empty}" class="empty">
            <i class="ti ti-clipboard-heart"></i>
            <p>No visits recorded yet.</p>
        </div>

        <table th:if="${!visits.empty}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Facility</th>
                    <th>Symptoms</th>
                    <th>Diagnosis</th>
                    <th>Visit Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="v : ${visits}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.patient.fullName}"></td>
                    <td th:text="${v.doctor != null ? v.doctor.fullName : '—'}"></td>
                    <td th:text="${v.facility != null ? v.facility.facilityName : '—'}"></td>
                    <td th:text="${#strings.abbreviate(v.symptoms, 40)}"></td>
                    <td th:text="${#strings.abbreviate(v.diagnosis, 40)}"></td>
                    <td th:text="${#temporals.format(v.visitDateTime, 'dd MMM yyyy HH:mm')}"></td>
                    <td>
                        <span th:class="${v.status == 'OPEN'} ? 'badge badge-open' : 'badge badge-closed'"
                              th:text="${v.status}"></span>
                    </td>
                    <td>
                        <a th:if="${v.status == 'OPEN'}"
                           th:href="@{/visits/{id}/close(id=${v.id})}"
                           class="btn btn-danger"
                           onclick="return confirm('Mark this visit as closed?')">
                            <i class="ti ti-check"></i> Close
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
