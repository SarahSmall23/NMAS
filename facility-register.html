<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Facility - NMAS</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#F0FAF5;
            padding:40px;
            color:#1A2E1A;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        .card{
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 8px 30px rgba(0,0,0,0.08);
        }

        h1{
            color:#1C2B2B;
            margin-bottom:10px;
        }

        .subtitle{
            color:#64748b;
            margin-bottom:30px;
        }

        .success{
            background:#dcfce7;
            color:#166534;
            padding:14px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .full{
            grid-column:1 / -1;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#1C2B2B;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #cbd5e1;
            border-radius:10px;
            font-size:14px;
        }

        .btn{
            margin-top:25px;
            background:#059669;
            color:white;
            border:none;
            padding:14px 20px;
            border-radius:10px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
        }

        .btn:hover{
            background:#1C2B2B;
        }

    </style>
</head>

<body>

<div class="container">

    <div style="margin-bottom:20px;">
        <a th:href="@{/redirect-dashboard}"
           style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#059669;color:white;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;">
            <i class="ti ti-layout-dashboard"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="card">

        <h1>
            <i class="ti ti-building-hospital"></i>
            Register Facility
        </h1>

        <p class="subtitle">
            Add a healthcare facility to the National Medical Access System.
        </p>

        <div th:if="${successMessage}" class="success"
             th:text="${successMessage}">
        </div>

        <form th:action="@{/facilities/register}"
              th:object="${facility}"
              method="post">

            <div class="form-grid">

                <div>
                    <label>Facility Name</label>
                    <input type="text"
                           th:field="*{facilityName}"
                           required>
                </div>

                <div>
                    <label>Facility Type</label>
                    <input type="text"
                           th:field="*{facilityType}"
                           placeholder="Hospital / Clinic"
                           required>
                </div>

                <div>
                    <label>Province</label>
                    <input type="text"
                           th:field="*{province}"
                           required>
                </div>

                <div>
                    <label>City</label>
                    <input type="text"
                           th:field="*{city}"
                           required>
                </div>

                <div class="full">
                    <label>Address</label>
                    <input type="text"
                           th:field="*{address}">
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="text"
                           th:field="*{phoneNumber}">
                </div>

                <div>
                    <label>Registration Number</label>
                    <input type="text"
                           th:field="*{registrationNumber}">
                </div>

            </div>

            <button type="submit" class="btn">
                <i class="ti ti-device-floppy"></i>
                Register Facility
            </button>

        </form>

    </div>

</div>

</body>
</html>
