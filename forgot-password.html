<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - NMAS</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body{ background:#F0FAF5; color:#1A2E1A; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card{ background:white; padding:40px; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,0.1); width:100%; max-width:420px; }
        .logo{ text-align:center; margin-bottom:30px; }
        .logo h1{ color:#1C2B2B; font-size:28px; }
        .logo p{ color:#64748b; font-size:13px; margin-top:4px; }
        h2{ font-size:22px; color:#1C2B2B; margin-bottom:8px; }
        .subtitle{ color:#64748b; font-size:14px; margin-bottom:25px; line-height:1.6; }
        .form-group{ margin-bottom:18px; }
        label{ display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
        input{ width:100%; padding:12px 14px; border:1px solid #d1fae5; border-radius:10px; font-size:14px; outline:none; transition:border-color 0.2s; }
        input:focus{ border-color:#059669; }
        .btn{ width:100%; padding:13px; background:#059669; color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; transition:background 0.2s; }
        .btn:hover{ background:#047857; }
        .error{ background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:12px 15px; border-radius:10px; font-size:13px; margin-bottom:18px; }
        .back{ text-align:center; margin-top:20px; }
        .back a{ color:#059669; text-decoration:none; font-size:14px; font-weight:600; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>NMAS</h1>
        <p>National Medical Access System</p>
    </div>
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your registered email address and we'll send a one-time PIN to reset your password.</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="your@email.com" required autofocus>
        </div>
        <button type="submit" class="btn">Send OTP</button>
    </form>

    <div class="back">
        <a th:href="@{/login}">&#8592; Back to Login</a>
    </div>
</div>
</body>
</html>
