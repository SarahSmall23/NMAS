<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointment Slots - NMAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body{ background:#F0FAF5; padding:40px; color:#1A2E1A; }
        .container{ max-width:1100px; margin:auto; }
        .top-actions{ margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap; }
        .nav-btn{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; background:#059669; color:white; padding:12px 18px; border-radius:10px; font-size:14px; font-weight:600; transition:0.2s; }
        .nav-btn:hover{ background:#1C2B2B; }
        .nav-btn.secondary{ background:#e2e8f0; color:#1A2E1A; }
        .nav-btn.secondary:hover{ background:#cbd5e1; }
        .header{ margin-bottom:30px; }
        .header h1{ color:#1C2B2B; font-size:32px; margin-bottom:8px; }
        .header p{ color:#64748b; }
        .info-box{ background:#ECFDF5; border:1px solid #6EE7B7; color:#065F46; padding:16px; border-radius:12px; margin-bottom:25px; line-height:1.7; }
        .section-card{ background:white; border-radius:18px; padding:25px; box-shadow:0 8px 25px rgba(0,0,0,0.06); overflow-x:auto; }
        table{ width:100%; border-collapse:collapse; min-width:600px; }
        thead{ background:#1C2B2B; color:white; }
        th{ padding:13px 14px; text-align:left; font-size:14px; }
        td{ padding:13px 14px; border-bottom:1px solid #e2e8f0; font-size:14px; vertical-align:middle; }
        tbody tr:hover{ background:#f8fafc; }
        .badge{ display:inline-block; padding:5px 10px; border-radius:30px; font-size:12px; font-weight:600; }
        .badge-green{ background:#dcfce7; color:#166534; }
        .badge-yellow{ background:#fef9c3; color:#854d0e; }
        .badge-red{ background:#fee2e2; color:#991b1b; }
        .empty-state{ padding:35px; text-align:center; color:#64748b; }
    </style>
</head>
<body>
<div class="container">

    <div class="top-actions">
        <a th:href="@{/availability}" class="nav-btn secondary">
            <i class="ti ti-arrow-left"></i> Back to Availability
        </a>
        <a th:href="@{/doctor-dashboard}" class="nav-btn secondary">
            <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
    </div>

    <div class="header">
        <h1><i class="ti ti-calendar-time"></i> Appointment Slots</h1>
        <p th:if="${availability != null}">
            <span th:text="${availability.availableDate}"></span>
            &mdash;
            <span th:text="${availability.shiftStartTime}"></span> to
            <span th:text="${availability.shiftEndTime}"></span>
        </p>
    </div>

    <div class="info-box">
        <strong>Slot overview:</strong>
        Each slot is 30 minutes. BOOKED slots show the patient name if an appointment is linked.
    </div>

    <div class="section-card">
        <table>
            <thead>
            <tr>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Status</th>
                <th>Patient</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(slots)}">
                <td colspan="4"><div class="empty-state">No slots found for this availability.</div></td>
            </tr>
            <tr th:each="slot : ${slots}">
                <td th:text="${slot.startTime}"></td>
                <td th:text="${slot.endTime}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${slot.status == 'AVAILABLE' ? 'badge-green' : (slot.status == 'BOOKED' ? 'badge-yellow' : 'badge-red')}"
                          th:text="${slot.status}"></span>
                </td>
                <td th:text="${slot.appointment != null ? slot.appointment.patient.fullName : '—'}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
