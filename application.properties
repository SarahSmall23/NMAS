# ── AIDEN AI Chatbot (runs natively inside NMAS, see AidenChatService) ───────
# Uses Groq's OpenAI-compatible chat completions API.
# Override aiden.ai.api-key via environment variable in production.
aiden.ai.api-key=${AIDEN_AI_API_KEY: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}
aiden.ai.endpoint=https://api.groq.com/openai/v1/chat/completions
# llama-3.3-70b-versatile was deprecated by Groq on June 17, 2026 — every AIDEN
# chat request was silently failing and always falling back to the "trouble
# connecting" message. Switched to Groq's recommended replacement.
aiden.ai.model=openai/gpt-oss-120b

# ── Session timeout ───────────────────────────────────────────────────────────
# Default (30 min) is too short for clinical work: video consultations plus
# writing up notes/prescriptions can easily run longer, and WebSocket activity
# (the video call signaling channel) does NOT reset the HTTP session timer —
# so the login session could silently expire mid-call even while the call
# itself kept working fine, causing prescription saves to fail afterward.
server.servlet.session.timeout=4h

# National system administrator login (everything the system admin does is logged under this email).
