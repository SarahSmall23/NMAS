<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Medical Info - NMAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body{ background:#F0FAF5; padding:40px; color:#1A2E1A; }
        .container{ max-width:960px; margin:auto; }
        .top-actions{ margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap; }
        .nav-btn{ display:inline-flex; align-items:center; gap:8px; text-decoration:none; background:#059669; color:white; padding:12px 18px; border-radius:10px; font-size:14px; font-weight:600; transition:0.2s; }
        .nav-btn:hover{ background:#1C2B2B; }
        .nav-btn.secondary{ background:#e2e8f0; color:#1A2E1A; }
        .nav-btn.secondary:hover{ background:#cbd5e1; }
        .header{ margin-bottom:30px; }
        .header h1{ color:#1C2B2B; font-size:32px; margin-bottom:8px; }
        .header p{ color:#64748b; }
        .card{ background:white; border-radius:18px; padding:35px; box-shadow:0 8px 30px rgba(0,0,0,0.08); margin-bottom:24px; }
        .patient-info{ background:#f8fafc; border-radius:12px; padding:18px; margin-bottom:25px; display:flex; gap:30px; flex-wrap:wrap; }
        .patient-info div strong{ display:block; color:#64748b; font-size:13px; margin-bottom:4px; }
        .patient-info div span{ font-size:15px; font-weight:600; color:#1C2B2B; }
        .section-title{ color:#1C2B2B; font-size:18px; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
        .section-title i{ color:#059669; font-size:22px; }
        .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
        .field{ margin-bottom:18px; }
        .field label{ display:block; margin-bottom:7px; font-size:14px; font-weight:600; color:#334155; }
        .field textarea, .field input, .field select{ width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; font-size:14px; background:#fff; resize:vertical; }
        .field textarea:focus, .field input:focus, .field select:focus{ border-color:#059669; outline:none; box-shadow:0 0 0 3px rgba(5,150,105,0.1); }
        .consent-row{ display:flex; align-items:center; gap:12px; padding:14px; background:#f8fafc; border-radius:10px; margin-bottom:12px; }
        .consent-row input[type=checkbox]{ width:18px; height:18px; accent-color:#059669; cursor:pointer; flex-shrink:0; }
        .consent-row label{ margin:0; font-size:14px; font-weight:600; color:#334155; cursor:pointer; }
        .consent-row small{ color:#64748b; font-size:12px; display:block; margin-top:2px; }
        .btn-area{ margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; }
        .btn{ padding:13px 22px; border:none; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:8px; transition:0.2s; text-decoration:none; }
        .btn-primary{ background:#059669; color:white; }
        .btn-primary:hover{ background:#1C2B2B; }
        .btn-secondary{ background:#e2e8f0; color:#1A2E1A; }
        .btn-secondary:hover{ background:#cbd5e1; }
        @media(max-width:640px){ .grid-2{ grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">

    <div class="top-actions">
        <a th:href="@{/patients/history/{id}(id=${patient.id})}" class="nav-btn secondary">
            <i class="ti ti-arrow-left"></i> Back to History
        </a>
        <a th:href="@{/redirect-dashboard}" class="nav-btn secondary">
            <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
    </div>

    <div class="header">
        <h1><i class="ti ti-user-edit"></i> Edit Medical Information</h1>
        <p>Update the patient's medical background, medical aid, and consent information.</p>
    </div>

    <div class="patient-info" style="background:white; border-radius:14px; padding:20px; box-shadow:0 4px 15px rgba(0,0,0,0.06); margin-bottom:24px;">
        <div><strong>Patient Name</strong><span th:text="${patient.fullName}">—</span></div>
        <div><strong>ID Number</strong><span th:text="${patient.idNumber != null ? patient.idNumber : '—'}">—</span></div>
        <div><strong>Date of Birth</strong><span th:text="${patient.dateOfBirth != null ? patient.dateOfBirth : '—'}">—</span></div>
        <div><strong>Gender</strong><span th:text="${patient.gender != null ? patient.gender : '—'}">—</span></div>
    </div>

    <form th:action="@{/patients/{id}/update-medical(id=${patient.id})}" method="post">

        <!-- MEDICAL INFORMATION -->
        <div class="card">
            <div class="section-title"><i class="ti ti-heart-rate-monitor"></i> Medical Information</div>

            <div class="grid-2">
                <div class="field">
                    <label>Blood Type</label>
                    <select name="bloodType">
                        <option value="">— Select —</option>
                        <option th:each="bt : ${'A+,A-,B+,B-,AB+,AB-,O+,O-'.split(',')}"
                                th:value="${bt}" th:text="${bt}"
                                th:selected="${patient.bloodType != null and patient.bloodType == bt}"></option>
                    </select>
                </div>
                <div class="field">
                    <label>Disabilities</label>
                    <input type="text" name="disabilities" th:value="${patient.disabilities}" placeholder="e.g. Visual impairment">
                </div>
            </div>

            <div class="field">
                <label>Allergies</label>
                <textarea name="allergies" rows="3" placeholder="List known allergies..." th:text="${patient.allergies}"></textarea>
            </div>

            <div class="field">
                <label>Chronic Conditions</label>
                <textarea name="chronicConditions" rows="3" placeholder="e.g. Diabetes, Hypertension..." th:text="${patient.chronicConditions}"></textarea>
            </div>

            <div class="field">
                <label>Current Medication</label>
                <textarea name="currentMedication" rows="3" placeholder="List current medications..." th:text="${patient.currentMedication}"></textarea>
            </div>

            <div class="field">
                <label>Past Surgeries</label>
                <textarea name="pastSurgeries" rows="3" placeholder="List past surgeries and dates..." th:text="${patient.pastSurgeries}"></textarea>
            </div>

            <div class="field">
                <label>Medical Notes</label>
                <textarea name="medicalNotes" rows="4" placeholder="Any additional clinical notes..." th:text="${patient.medicalNotes}"></textarea>
            </div>
        </div>

        <!-- MEDICAL AID -->
        <div class="card">
            <div class="section-title"><i class="ti ti-id-badge"></i> Medical Aid</div>

            <div class="grid-2">
                <div class="field">
                    <label>Medical Aid Status</label>
                    <select name="medicalAidStatus">
                        <option value="">— Select —</option>
                        <option value="Insured" th:selected="${patient.medicalAidStatus == 'Insured'}">Insured</option>
                        <option value="Uninsured" th:selected="${patient.medicalAidStatus == 'Uninsured'}">Uninsured</option>
                        <option value="Government" th:selected="${patient.medicalAidStatus == 'Government'}">Government / Public</option>
                    </select>
                </div>
                <div class="field">
                    <label>Medical Aid Provider</label>
                    <input type="text" name="medicalAidProvider" th:value="${patient.medicalAidProvider}" placeholder="e.g. Discovery Health">
                </div>
                <div class="field">
                    <label>Medical Aid Number</label>
                    <input type="text" name="medicalAidNumber" th:value="${patient.medicalAidNumber}" placeholder="Membership number">
                </div>
            </div>
        </div>

        <!-- CONSENT -->
        <div class="card">
            <div class="section-title"><i class="ti ti-shield-check"></i> Consent &amp; POPIA</div>

            <div class="consent-row">
                <input type="checkbox" id="consentStore" name="consentToStoreRecords" value="true"
                       th:checked="${patient.consentToStoreRecords}">
                <label for="consentStore">
                    Consent to Store Records
                    <small>Patient consents to their medical records being stored in the NMAS system.</small>
                </label>
            </div>

            <div class="consent-row">
                <input type="checkbox" id="consentShare" name="consentToShareRecords" value="true"
                       th:checked="${patient.consentToShareRecords}">
                <label for="consentShare">
                    Consent to Share Records
                    <small>Patient consents to their records being shared with authorised healthcare providers.</small>
                </label>
            </div>
        </div>

        <div class="btn-area">
            <button type="submit" class="btn btn-primary">
                <i class="ti ti-device-floppy"></i> Save Changes
            </button>
            <a th:href="@{/patients/history/{id}(id=${patient.id})}" class="btn btn-secondary">
                <i class="ti ti-x"></i> Cancel
            </a>
        </div>

    </form>

</div>
</body>
</html>
